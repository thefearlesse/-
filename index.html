<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ПІЛІВЄЄЄЄЄЄЄТ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #FFE4D1;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      padding: 25px 15px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .me {
      width: min(330px, 80vw);
      margin-top: 10px;
      mix-blend-mode: darken;
    }


    /* ПІЛІВЄЄЄЄЄЄЄЄЄТ */

    .hello {
      position: relative;
      width: 100%;
      height: 95px;
      overflow: hidden;
      margin: 5px 0 20px;
    }

    .hello-text {
      position: absolute;
      white-space: nowrap;

      font-size: clamp(32px, 9vw, 65px);
      font-weight: 900;
      color: #111;

      animation:
        moveText 3.2s linear infinite,
        bounceText 0.55s ease-in-out infinite alternate;
    }

    @keyframes moveText {
      from {
        left: 100%;
      }

      to {
        left: -120%;
      }
    }

    @keyframes bounceText {
      from {
        transform: translateY(5px) rotate(-2deg);
      }

      to {
        transform: translateY(-8px) rotate(2deg);
      }
    }


    /* ЛІТАЮЧІ СМАЙЛИКИ */

    .decor {
      position: absolute;
      pointer-events: none;
      font-size: 25px;
      animation: floatAround 2.5s ease-in-out infinite alternate;
    }

    .d1 {
      left: 8%;
      top: 5px;
      animation-delay: 0s;
    }

    .d2 {
      right: 8%;
      top: 15px;
      animation-delay: 0.5s;
    }

    .d3 {
      left: 18%;
      bottom: 5px;
      animation-delay: 0.8s;
    }

    .d4 {
      right: 18%;
      bottom: 0;
      animation-delay: 1.2s;
    }

    @keyframes floatAround {
      from {
        transform: translateY(8px) rotate(-10deg);
      }

      to {
        transform: translateY(-12px) rotate(12deg);
      }
    }


    /* ТЕКСТ */

    .reply-text {
      font-size: clamp(18px, 5vw, 30px);
      font-weight: 800;
      margin: 5px 0 12px;
    }
