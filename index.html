<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ПІЛІВЄЄЄЄЄЄЄТ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #FFE4D1;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      padding: 25px 15px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .me {
      width: min(330px, 80vw);
      margin-top: 10px;

      /* Прибирає білий фон картинки візуально */
      mix-blend-mode: darken;
    }

    /* РУХОМИЙ ПІЛІВЄЄЄЄЄЄЄТ */

    .hello {
      width: 100%;
      overflow: hidden;
      margin: 10px 0 25px;
      white-space: nowrap;
    }

    .hello-text {
      display: inline-block;
      font-size: clamp(32px, 9vw, 65px);
      font-weight: 900;
      color: #111;

      animation: moveText 3s linear infinite;
    }

    @keyframes moveText {
      from {
        transform: translateX(100%);
      }

      to {
        transform: translateX(-100%);
      }
    }


    /* ТЕКСТ НАД КНОПКОЮ */

    .reply-text {
      font-size: clamp(18px, 5vw, 30px);
      font-weight: 800;
      margin: 15px 0 8px;
    }


    /* КНОПКА */

    .hand {
      width: 120px;
      height: 120px;

      border: 5px solid #888;
      background: #FFE4D1;

      font-size: 70px;

      cursor: pointer;

      border-radius: 50%;

      box-shadow:
        0 7px 0 #666,
        0 10px 20px rgba(0, 0, 0, 0.25);

      transition:
        transform 0.12s,
        box-shadow 0.12s;

      touch-action: manipulation;
    }

    .hand:active {
      transform: translateY(6px) scale(0.95);

      box-shadow:
        0 2px 0 #666,
        0 5px 10px rgba(0, 0, 0, 0.2);
    }

  </style>
</head>


<body>

  <div class="page">

    <!-- Твій чувак -->

    <img
      class="me"
      id="me"
      src="me1.png"
      alt="Я махаю"
    >


    <!-- Рухомий текст -->

    <div class="hello">

      <div class="hello-text">
        ПІЛІВЄЄЄЄЄЄЄЄЄЄЄЄЄЄЄТ
      </div>

    </div>


    <!-- Текст над кнопкою -->

    <div class="reply-text">
      ПІЛІВЄЄЄЄЄЄЄЄЄЄЄЄЄЄТ У ВІДПОВІДЬ
    </div>


    <!-- КНОПКА -->

    <button class="hand" onclick="helloBack()">
      👋
    </button>

  </div>


  <script>

    // ШВИДКЕ МАХАННЯ

    const me = document.getElementById("me");

    let frame = 1;

    setInterval(() => {

      frame = frame === 1 ? 2 : 1;

      me.src = `me${frame}.png`;

    }, 140);


    // РЕАКЦІЯ НА НАТИСКАННЯ

    function helloBack() {

      document.querySelector(".reply-text").textContent =
        "ОГО, ВІДПОВІЛА 😭❤️";

      document.querySelector(".hand").textContent =
        "👋🥹";

    }

  </script>

</body>
</html>
