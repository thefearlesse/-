<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ПІЛІВЄЄЄЄЄЄЄТ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #FFE4D1;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      padding: 25px 12px 60px;
    }


    /* =====================================================
       ПЕРША СТОРІНКА
       ===================================================== */

    #page1 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .me {
      width: min(330px, 80vw);
      margin-top: 10px;
      mix-blend-mode: darken;
    }

    .hello {
      position: relative;
      width: 100%;
      height: 100px;
      overflow: hidden;
      margin: 5px 0 15px;
    }

    .hello-text {
      position: absolute;
      white-space: nowrap;

      font-size: clamp(32px, 9vw, 65px);
      font-weight: 900;
      color: #111;

      animation:
        moveText 3.2s linear infinite,
        bounceText 0.55s ease-in-out infinite alternate;
    }

    @keyframes moveText {
      from {
        left: 100%;
      }

      to {
        left: -120%;
      }
    }

    @keyframes bounceText {
      from {
        transform: translateY(5px) rotate(-2deg);
      }

      to {
        transform: translateY(-8px) rotate(2deg);
      }
    }

    .decor {
      position: absolute;
      pointer-events: none;
      font-size: 25px;
      animation: floatAround 2.5s ease-in-out infinite alternate;
      z-index: 2;
    }

    .d1 {
      left: 8%;
      top: 5px;
    }

    .d2 {
      right: 8%;
      top: 15px;
    }

    .d3 {
      left: 18%;
      bottom: 5px;
    }

    .d4 {
      right: 18%;
      bottom: 0;
    }

    @keyframes floatAround {
      from {
        transform: translateY(8px) rotate(-10deg);
      }

      to {
        transform: translateY(-12px) rotate(12deg);
      }
    }

    .reply-text {
      font-size: clamp(18px, 5vw, 30px);
      font-weight: 800;
      margin: 5px 0 12px;

      min-height: 38px;
    }

    .hand {
      width: 120px;
      height: 120px;

      border: 5px solid #888;
      background: #FFE4D1;

      font-size: 70px;

      cursor: pointer;
      border-radius: 50%;

      box-shadow:
        0 7px 0 #666,
        0 10px 20px rgba(0, 0, 0, 0.25);

      transition:
        transform 0.12s,
        box-shadow 0.12s;

      touch-action: manipulation;
    }

    .hand:active {
      transform: translateY(6px) scale(0.95);

      box-shadow:
        0 2px 0 #666,
        0 5px 10px rgba(0, 0, 0, 0.2);
    }


    /* =====================================================
       ДРУГА СТОРІНКА
       ===================================================== */

    #page2 {
      display: none;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
    }

    .page2-title {
      font-size: clamp(24px, 7vw, 42px);
      font-weight: 900;
      margin: 5px 0 25px;
      line-height: 1.05;
    }


    /* =====================================================
       ФОТО + МОТУЗКИ
       ===================================================== */

    .photos-area {
      width: 100%;
      max-width: 650px;
      margin: 0 auto 35px;
    }

    .rope-row {
      position: relative;
      height: 170px;
      margin-bottom: 5px;
    }


    /* СПРАВЖНЄ ЛЕГКЕ ПРОВИСАННЯ МОТУЗКИ */

    .rope {
      position: absolute;

      left: -5%;
      width: 110%;
      height: 45px;

      border-bottom: 7px solid #8B6548;
      border-radius: 0 0 50% 50%;

      filter: drop-shadow(0 3px 2px rgba(0,0,0,0.15));

      z-index: 1;
    }

    .rope1 {
      top: 15px;
      transform: rotate(2deg);
    }

    .rope2 {
      top: 20px;
      transform: rotate(-2deg);
    }

    .rope3 {
      top: 12px;
      transform: rotate(2deg);
    }


    /* =====================================================
       ФОТО
       ===================================================== */

    .photo {
      position: absolute;

      width: 82px;
      height: 100px;

      object-fit: cover;

      background: white;

      padding: 5px 5px 14px;

      border-radius: 2px;

      box-shadow:
        0 5px 10px rgba(0, 0, 0, 0.22);

      transform-origin: top center;

      z-index: 2;
    }


    /* РІЗНІ КУТИ + ЛЕГКЕ ПОГОЙДУВАННЯ */

    .p1 {
      left: 7%;
      top: 43px;
      --angle: -7deg;
      animation: swing1 3.2s ease-in-out infinite alternate;
    }

    .p2 {
      left: 36%;
      top: 48px;
      --angle: 5deg;
      animation: swing2 3.5s ease-in-out infinite alternate;
    }

    .p3 {
      right: 7%;
      top: 42px;
      --angle: -4deg;
      animation: swing3 3.1s ease-in-out infinite alternate;
    }

    .p4 {
      left: 18%;
      top: 47px;
      --angle: 6deg;
      animation: swing4 3.6s ease-in-out infinite alternate;
    }

    .p5 {
      right: 18%;
      top: 43px;
      --angle: -6deg;
      animation: swing5 3.3s ease-in-out infinite alternate;
    }

    .p6 {
      left: 7%;
      top: 45px;
      --angle: 5deg;
      animation: swing6 3.4s ease-in-out infinite alternate;
    }

    .p7 {
      left: 36%;
      top: 48px;
      --angle: -5deg;
      animation: swing7 3.7s ease-in-out infinite alternate;
    }

    .p8 {
      right: 7%;
      top: 43px;
      --angle: 7deg;
      animation: swing8 3.2s ease-in-out infinite alternate;
    }


    @keyframes swing1 {
      from {
        transform: rotate(calc(var(--angle) - 2deg));
      }

      to {
        transform: rotate(calc(var(--angle) + 2deg));
      }
    }

    @keyframes swing2 {
      from {
        transform: rotate(calc(var(--angle) + 2deg));
      }

      to {
        transform: rotate(calc(var(--angle) - 2deg));
      }
    }

    @keyframes swing3 {
      from {
        transform: rotate(calc(var(--angle) - 2deg));
      }

      to {
        transform: rotate(calc(var(--angle) + 2deg));
      }
    }

    @keyframes swing4 {
      from {
        transform: rotate(calc(var(--angle) + 2deg));
      }

      to {
        transform: rotate(calc(var(--angle) - 2deg));
      }
    }

    @keyframes swing5 {
      from {
        transform: rotate(calc(var(--angle) - 2deg));
      }

      to {
        transform: rotate(calc(var(--angle) + 2deg));
      }
    }

    @keyframes swing6 {
      from {
        transform: rotate(calc(var(--angle) + 2deg));
      }

      to {
        transform: rotate(calc(var(--angle) - 2deg));
      }
    }

    @keyframes swing7 {
      from {
        transform: rotate(calc(var(--angle) - 2deg));
      }

      to {
        transform: rotate(calc(var(--angle) + 2deg));
      }
    }

    @keyframes swing8 {
      from {
        transform: rotate(calc(var(--angle) + 2deg));
      }

      to {
        transform: rotate(calc(var(--angle) - 2deg));
      }
    }


    /* =====================================================
       ПРИЩІПКИ
       ===================================================== */

    .clip {
      position: absolute;

      width: 20px;
      height: 30px;

      background: #D9D9D9;

      border: 2px solid #777;

      border-radius: 5px 5px 8px 8px;

      z-index: 5;

      box-shadow:
        0 2px 3px rgba(0, 0, 0, 0.2);
    }

    .clip::before {
      content: "";

      position: absolute;

      width: 8px;
      height: 17px;

      border: 2px solid #777;

      border-radius: 50%;

      left: 4px;
      top: 3px;
    }


    /* =====================================================
       ПЕРЕВІРКА
       ===================================================== */

    .captcha-title {
      font-size: clamp(20px, 5vw, 30px);
      font-weight: 900;
      margin: 5px 0 15px;
    }

    .captcha-subtitle {
      font-size: 15px;
      color: #555;
      margin-bottom: 18px;
    }

    .finger-button {
      position: relative;

      width: 125px;
      height: 125px;

      border-radius: 50%;

      border: 5px solid #888;

      background: #FFE4D1;

      font-size: 62px;

      cursor: pointer;

      box-shadow:
        0 7px 0 #666,
        0 10px 20px rgba(0, 0, 0, 0.25);

      user-select: none;
      -webkit-user-select: none;

      touch-action: none;
    }

    .finger-button:active {
      transform: translateY(5px);

      box-shadow:
        0 2px 0 #666,
        0 5px 10px rgba(0, 0, 0, 0.2);
    }


    /* =====================================================
       ПРОГРЕС
       ===================================================== */

    .progress-ring {
      position: absolute;

      inset: -9px;

      border-radius: 50%;

      border: 7px solid transparent;

      border-top-color: #777;

      transform: rotate(-45deg);

      display: none;
    }

    .holding .progress-ring {
      display: block;

      animation: progress 3s linear forwards;
    }

    @keyframes progress {
      from {
        clip-path: inset(0 100% 0 0);
      }

      to {
        clip-path: inset(0 0 0 0);
      }
    }


    /* =====================================================
       УСПІХ
       ===================================================== */

    .success {
      display: none;

      margin-top: 25px;

      animation: successPop .5s ease-out;
    }

    .success-check {
      font-size: 70px;
      font-weight: 900;
    }

    .success-text {
      font-size: clamp(22px, 6vw, 34px);
      font-weight: 900;
      line-height: 1.15;
    }

    .success-love {
      margin-top: 12px;
      font-size: clamp(20px, 5vw, 30px);
      font-weight: 800;
    }

    @keyframes successPop {
      from {
        transform: scale(.5);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

  </style>
</head>


<body>


  <!-- =====================================================
       ПЕРША СТОРІНКА
       ===================================================== -->

  <div id="page1" class="page">

    <img
      class="me"
      id="me"
      src="me1.png"
      alt="Я махаю"
    >


    <div class="hello">

      <div class="decor d1">♡</div>

      <div class="decor d2">✦</div>

      <div class="decor d3">:3</div>

      <div class="decor d4">👋</div>


      <div class="hello-text">
        ПІЛІВЄЄЄЄЄЄЄЄЄЄЄЄЄЄЄТ
      </div>

    </div>


    <div class="reply-text" id="replyText">
      ПІЛІВЄЄЄЄЄЄЄЄЄЄЄЄЄЄЄТ У ВІДПОВІДЬ
    </div>


    <button class="hand" id="helloButton">
      👋
    </button>

  </div>



  <!-- =====================================================
       ДРУГА СТОРІНКА
       ===================================================== -->

  <div id="page2" class="page">


    <div class="page2-title">
      ТУТ ТРОХИ<br>
      НАШИХ ФОТОЧОК 📸
    </div>



    <div class="photos-area">


      <!-- =================================================
           МОТУЗКА 1
           ================================================= -->

      <div class="rope-row">

        <div class="rope rope1"></div>


        <img
          class="photo p1"
          src="photo1.jpg"
          alt="Фото 1"
        >

        <div
          class="clip"
          style="left: 10%; top: 32px;"
        ></div>



        <img
          class="photo p2"
          src="photo2.jpg"
          alt="Фото 2"
        >

        <div
          class="clip"
          style="left: 39%; top: 37px;"
        ></div>



        <img
          class="photo p3"
          src="photo3.jpg"
          alt="Фото 3"
        >

        <div
          class="clip"
          style="right: 10%; top: 32px;"
        ></div>

      </div>



      <!-- =================================================
           МОТУЗКА 2
           ================================================= -->

      <div class="rope-row">

        <div class="rope rope2"></div>


        <img
          class="photo p4"
          src="photo4.jpg"
          alt="Фото 4"
        >

        <div
          class="clip"
          style="left: 21%; top: 36px;"
        ></div>



        <img
          class="photo p5"
          src="photo5.jpg"
          alt="Фото 5"
        >

        <div
          class="clip"
          style="right: 21%; top: 32px;"
        ></div>

      </div>



      <!-- =================================================
           МОТУЗКА 3
           ================================================= -->

      <div class="rope-row">

        <div class="rope rope3"></div>


        <img
          class="photo p6"
          src="photo6.jpg"
          alt="Фото 6"
        >

        <div
          class="clip"
          style="left: 10%; top: 34px;"
        ></div>



        <img
          class="photo p7"
          src="photo7.jpg"
          alt="Фото 7"
        >

        <div
          class="clip"
          style="left: 39%; top: 37px;"
        ></div>



        <img
          class="photo p8"
          src="photo8.jpg"
          alt="Фото 8"
        >

        <div
          class="clip"
          style="right: 10%; top: 32px;"
        ></div>

      </div>

    </div>



    <!-- =================================================
         ПЕРЕВІРКА
         ================================================= -->

    <div class="captcha-title">
      ПЕРЕВІРКА НА<br>
      КОХАНУ ТАНКЄТАЧКУ ❤️
    </div>


    <div class="captcha-subtitle">
      Затисни відбиток пальця на 3 секунди
    </div>



    <button
      class="finger-button"
      id="fingerButton"
    >

      ☝️

      <div class="progress-ring"></div>

    </button>



    <!-- =================================================
         УСПІШНА ПЕРЕВІРКА
         ================================================= -->

    <div
      class="success"
      id="success"
    >

      <div class="success-check">
        ✓
      </div>


      <div class="success-text">
        ПЕРЕВІРКУ ПРОЙДЕНО
      </div>


      <div class="success-love">
        Я ТЕБЕ ДУЖЕ ДУЖЕ СИЛЬНО КОХАЮ ❤️
      </div>

    </div>

  </div>



  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>


    /* =====================================================
       АНІМАЦІЯ МАХАННЯ
       ===================================================== */

    const me = document.getElementById("me");

    let frame = 1;


    setInterval(() => {

      frame = frame === 1 ? 2 : 1;

      me.src = `me${frame}.png`;

    }, 140);



    /* =====================================================
       ПЕРЕХІД ПІСЛЯ 👋
       ===================================================== */

    const helloButton =
      document.getElementById("helloButton");

    const replyText =
      document.getElementById("replyText");

    const page1 =
      document.getElementById("page1");

    const page2 =
      document.getElementById("page2");


    helloButton.addEventListener("click", () => {


      /* Спочатку показуємо реакцію */

      replyText.textContent =
        "ДААААА ВОНА ПОМАХАЛА 😭❤️";


      helloButton.textContent =
        "👋🥹";


      /* Через 2 секунди переходимо далі */

      setTimeout(() => {

        page1.style.display = "none";

        page2.style.display = "flex";


        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }, 2000);

    });



    /* =====================================================
       ПЕРЕВІРКА ПАЛЬЦЕМ
       ===================================================== */

    const fingerButton =
      document.getElementById("fingerButton");

    const success =
      document.getElementById("success");


    let holdTimer = null;

    let holding = false;



    /* ПОЧАТОК НАТИСКАННЯ */

    function startHold(event) {

      event.preventDefault();


      if (holding) {
        return;
      }


      holding = true;


      fingerButton.classList.add("holding");


      holdTimer = setTimeout(() => {


        holding = false;


        fingerButton.classList.remove("holding");


        fingerButton.style.display = "none";


        success.style.display = "block";


      }, 3000);

    }



    /* ВІДПУСТИВ ПАЛЕЦЬ */

    function stopHold() {

      if (!holding) {
        return;
      }


      holding = false;


      clearTimeout(holdTimer);


      fingerButton.classList.remove("holding");

    }



    /* =====================================================
       ПОДІЇ ПАЛЬЦЯ
       ===================================================== */

    fingerButton.addEventListener(
      "pointerdown",
      startHold
    );


    fingerButton.addEventListener(
      "pointerup",
      stopHold
    );


    fingerButton.addEventListener(
      "pointercancel",
      stopHold
    );


    fingerButton.addEventListener(
      "pointerleave",
      stopHold
    );


  </script>

</body>
                               </html>
